# The blog's index (layouts/blog/list.html): its topic chips start with these tags under these labels, the old reading
# tracks; every other tag the listed posts carry follows. A tag with no listed post is skipped; one with no tag page at
# all fails the build.
topics:
  - tag: "openapi"
    label: "API design"
  - tag: "observability"
    label: "Observability"
  - tag: "kotlin"
    label: "Kotlin/JVM"
  - tag: "spring-boot"
    label: "Spring Boot"
