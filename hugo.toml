baseURL = "https://yonatankarp.com/"
title = "Yonatan Karp-Rudin"

[pagination]
pagerSize = 5

[outputs]
  page = ["HTML"]
  home = ["HTML", "RSS", "JSON", "LLMS", "HashnodeRSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
  # Hashnode's old feed path; feed readers do not follow HTML redirects, so /rss.xml serves the blog feed (#117).
  [outputFormats.HashnodeRSS]
    mediaType = "application/rss+xml"
    baseName = "rss"
    notAlternative = true

[taxonomies]
  tag = "tags"

# The old experience, education and testimonial pages are redirects to their homepage floors (#133):
# layouts/_default/redirect.html. The content stays, for the homepage, the CV and the search index.
[[cascade]]
  layout = "redirect"
  outputs = ["html"]
  [cascade.params]
    noindex = true
  [cascade.target]
    path = "{/experience,/experience/**,/education,/education/**,/testimonial,/testimonial/**}"

# Related-content engine for the "Keep reading" widget on blog posts.
[related]
  threshold = 80
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[params]
title = "Yonatan Karp-Rudin - Staff Software Engineer"
description = "Staff Software Engineer based in Berlin, Germany. Building payment, compliance, and platform systems at Billie. Open source contributor."

[params.seo]
siteName = "Yonatan Karp-Rudin"

[params.social]
twitter = "yonvata"

[params.seo.person]
sameAs = [
  "https://github.com/yonatankarp",
  "https://www.linkedin.com/in/yonatankarp/",
]

# --- Markup & Performance ---

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    lineNos = false
    noClasses = false
    style = "darcula"

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Smart"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[minify]
  minifyOutput = true

