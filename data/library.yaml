# The blog's Library (layouts/blog/list.html): its shelves, left to right, start with these tags under these labels, the
# old reading tracks; the shelves left over take the tags most listed posts carry. A tag with no listed post is skipped;
# one with no tag page at all fails the build.
shelves:
  - tag: "openapi"
    label: "API design"
  - tag: "observability"
    label: "Observability"
  - tag: "kotlin"
    label: "Kotlin/JVM"
  - tag: "spring-boot"
    label: "Spring Boot"
