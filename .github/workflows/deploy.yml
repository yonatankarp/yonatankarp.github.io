name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUGO_VERSION: 0.169.0
      # The .deb's line in the release's hugo_<version>_checksums.txt; it changes with HUGO_VERSION.
      HUGO_SHA256: a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Hugo CLI
        run: |
          deb="${RUNNER_TEMP}/hugo.deb"
          wget -O "$deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Check blog assets
        run: npm run check:blog-assets

      - name: Build the pixel building
        run: npm run build:building

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir

      - name: Check generated site metadata
        run: npm run check:site-metadata

      - name: Check generated HTML
        run: npm run check:generated-html

      - name: Generate CV PDF
        run: npm run pdf

      - name: Check CV print length
        run: npm run check:cv-print

      - name: Check internal links
        run: npm run check:links

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    # Only the job that publishes gets the Pages and OIDC tokens; the build runs npm ci and Playwright.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
