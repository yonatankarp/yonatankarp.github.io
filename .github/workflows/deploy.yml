name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  # Weekly, off the hour: the build counts the career's years (partials/career-years.html), which a deploy only on
  # push would leave stale past an anniversary.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # A workflow_dispatch from another branch must not reach Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the site
        uses: ./.github/actions/build-site

      - name: Check the CSP and accessibility in Chromium
        env:
          CSP_WORKERS: 8
        run: npm run check:csp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          # Without it the action drops dot-directories, and /.well-known/security.txt (#190) with them.
          include-hidden-files: true

  # The baseline pull requests compare their screenshots with (ci.yml downloads visual-smoke-main from the newest
  # successful run). It captures the Pages artifact that ships, in parallel with deploy, and never fails the run.
  visual_capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Unpack it into public/
        run: |
          mkdir -p public
          tar -xf "${RUNNER_TEMP}/pages/artifact.tar" -C public

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Playwright's Chromium
        uses: ./.github/actions/setup-playwright

      - name: Capture visual smoke screenshots
        continue-on-error: true
        env:
          TZ: Europe/Berlin
        run: npm run visual:capture -- --public --out artifacts/visual-smoke/main

      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-main
          path: artifacts/visual-smoke/main/
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/main'
    # Only the job that publishes gets the Pages and OIDC tokens; the build runs npm ci and Playwright.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
