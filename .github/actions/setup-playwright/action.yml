name: Set up Playwright's browsers
description: Installs browsers (Chromium unless told) for the Playwright version in node_modules, cached by that version.

# The caller has run npm ci. Shared by build-site, the deploy's visual capture job and the cross-browser check.
inputs:
  browsers:
    description: The browsers to install, separated by spaces.
    default: chromium
runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

    - name: Cache the Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        # Plain Chromium keeps its old key, so its cache stays warm; other browsers get one of their own.
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}${{ inputs.browsers != 'chromium' && format('-{0}', inputs.browsers) || '' }}

    - name: Install Playwright browser
      shell: bash
      env:
        CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # On a hit the browser's libraries are on the runner already, but not the fonts install-deps adds (unifont,
        # wqy-zenhei, ipafont, ...): without them the diagrams, the CV PDF and the captures would fall back differently.
        if [[ "$CACHED" == "true" ]]; then
          npx playwright install-deps $BROWSERS
        else
          npx playwright install --with-deps $BROWSERS
        fi
