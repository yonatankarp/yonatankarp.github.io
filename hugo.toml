baseURL = "https://yonatankarp.com/"
title = "Yonatan Karp-Rudin"

# Post images stay in static/ at their URLs, which old posts and other sites link, and are assets too, so
# layouts/_default/_markup/render-image.html can resize them. A mount drops its component's default, hence the first one.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static/images/blog"
  target = "assets/images/blog"

[outputs]
  page = ["HTML"]
  home = ["HTML", "RSS", "JSON", "LLMS", "HashnodeRSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
  # Hashnode's old feed path; feed readers do not follow HTML redirects, so /rss.xml serves the blog feed (#117).
  [outputFormats.HashnodeRSS]
    mediaType = "application/rss+xml"
    baseName = "rss"
    notAlternative = true

[taxonomies]
  tag = "tags"

# The old experience, education and testimonial pages are redirects to their homepage floors (#133):
# layouts/_default/redirect.html. The content stays, for the homepage, the CV and the search index.
[[cascade]]
  layout = "redirect"
  outputs = ["html"]
  [cascade.params]
    noindex = true
  [cascade.target]
    path = "{/experience,/experience/**,/education,/education/**,/testimonial,/testimonial/**}"

# Related-content engine for the "Keep reading" widget on blog posts.
[related]
  threshold = 80
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[params]
# Search Console ownership (URL-prefix property https://yonatankarp.com/). Keep it, or the property loses verification.
googleSiteVerification = "nImN1GWT_OPSL1y1RiVIsi0ZkQ-4SLRZauiW0YDQxTI"
title = "Yonatan Karp-Rudin - Staff Software Engineer"
description = "Staff Software Engineer based in Berlin, Germany. Building payment, compliance, and platform systems at Billie. Open source contributor."

[params.seo]
siteName = "Yonatan Karp-Rudin"

[params.social]
twitter = "yonvata"

[params.seo.person]
alternateName = "Yonatan Karp"
# Each profile checked to be his: the name matches and it links back here, or (Medium, Apple Podcasts) its feed names him.
sameAs = [
  "https://github.com/yonatankarp",
  "https://www.linkedin.com/in/yonatankarp/",
  "https://dev.to/yonatankarp",
  "https://medium.com/@yonatankarp",
  "https://sessionize.com/yonatankarp/",
  "https://stackoverflow.com/users/3899765/yonatan-karp-rudin",
  "https://podcasts.apple.com/us/podcast/the-reading-club/id1770149395",
]

# --- Markup & Performance ---

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    lineNos = false
    noClasses = false
    style = "darcula"

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Smart"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[minify]
  minifyOutput = true

