name: Site CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Validate Hugo build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUGO_VERSION: 0.169.0
      # The .deb's line in the release's hugo_<version>_checksums.txt; it changes with HUGO_VERSION.
      HUGO_SHA256: a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Hugo CLI
        run: |
          deb="${RUNNER_TEMP}/hugo.deb"
          wget -O "$deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Check blog assets
        run: npm run check:blog-assets

      - name: Build the pixel building
        run: npm run build:building

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir

      - name: Check generated site metadata
        run: npm run check:site-metadata

      - name: Check generated HTML
        run: npm run check:generated-html

      - name: Generate CV PDF
        run: npm run pdf

      - name: Check CV print length
        run: npm run check:cv-print

      - name: Check internal links
        run: npm run check:links

      - name: Check the Content-Security-Policy in Chromium
        run: npm run check:csp

      - name: Capture visual smoke screenshots
        env:
          TZ: Europe/Berlin
        run: npm run visual:capture

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-smoke-screenshots
          path: artifacts/visual-smoke/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  dependabot_auto_merge:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    uses: yonatankarp/github-actions/.github/workflows/dependabot-auto-merge.yml@c4d2c5ba8c9ff912200441da8847d06325e6aa1d # v2
    secrets:
      GITHUB_PAT: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
