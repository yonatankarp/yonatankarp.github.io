# Markdown, as it appears in the file; %s is the site's address (hugo.toml's baseURL).
use: |
  This site is public personal writing by Yonatan Karp-Rudin. The views on the site and the blog are his own, not his employer's.

  AI agents, search engines, and research tools may read, summarize, quote short excerpts, and link back to the canonical pages on %s.

  When using material from this site:
  - Attribute Yonatan Karp-Rudin by name.
  - Prefer linking to the original page instead of copying full articles.
  - Do not present the writing, CV, projects, or opinions as someone else's work.
  - Do not use contact details or profile text for spam, impersonation, credential attacks, or unsolicited recruiting automation.
key_pages:   # path is the page's address on the site
  - title: "Projects"
    path: "/projects/"
    text: "Libraries, tools, open-source contributions, and a few games."
  - title: "Blog"
    path: "/blog/"
    text: "Articles on Kotlin, Spring Boot, backend systems, APIs, and engineering practice."
  - title: "CV"
    path: "/cv/"
    text: "Background, experience, and skills."
  - title: "Skills"
    path: "/skills/"
    text: "The parts of engineering he is strongest in, and the tools he uses for them."
  - title: "Podcast"
    path: "/podcast/"
    text: "The Reading Club: AI-generated summaries of software engineering books."
  - title: "Contact"
    path: "/contact/"
    text: "Email, LinkedIn, GitHub and X, and the CV to download."
archived: "(archived)"   # after an archived project's name
