name: Pin staleness

# Hugo is installed from a GitHub release by the build-site action, at the version
# pinned in .github/hugo.env, so it is a string in a file rather than a dependency:
# Dependabot updates npm and the action refs and never sees it. Left alone, the site
# keeps being built by whatever Hugo was current on the day somebody typed the pin.
# This reports that, and fails, and reports, when HUGO_SHA256 is not the release's
# published checksum of the .deb.

on:
  schedule:
    # Weekly, and off the hour -- scheduled runs queue hardest on the boundary, and
    # even so they have started hours late (06:23 has meant 13:00 to 16:00 UTC).
    # A pin like this moves when a human decides to move it, so a daily run would
    # only repeat a finding already sitting on the issue.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LABEL: toolchain-pin
  GH_REPO: ${{ github.repository }}

jobs:
  # security.txt's Expires date is a pin of the same kind: nothing moves it on. A warning
  # on the run within 60 days of it, a failed run once it has passed. Its own job, so the
  # Hugo issue below never opens or closes over it.
  security-txt:
    name: security.txt expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the Expires date
        run: npm run --silent check:security-txt

  hugo-pin:
    name: Hugo pin against its newest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Compare the pin with the newest Hugo release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-hugo-pin.js --github-output

      - name: Open or update the one issue
        # The check exits non-zero on a wrong checksum after writing the issue; report it anyway.
        if: ${{ !cancelled() && steps.check.outputs.status == 'stale' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.check.outputs.title }}
          BODY: ${{ steps.check.outputs.body }}
        # One issue, edited in place. A fresh issue every Monday -- or a comment
        # every Monday -- is how this gets muted, and a muted report is the same
        # as no report at all.
        run: |
          gh label create "$LABEL" --color BFD4F2 --force \
            --description "A version this repository pins that no bot updates"
          number=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --title "$TITLE" --body "$BODY"
          else
            gh issue create --label "$LABEL" --title "$TITLE" --body "$BODY"
          fi

      - name: Close it once the pin has caught up
        if: steps.check.outputs.status == 'current'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Whoever bumps the pin should not also have to tidy up after the report.
        # A status of "unknown" reaches neither step: an unreachable release API
        # is not evidence that the pin is stale, nor that it is current. The check
        # flags it as a warning on the run instead.
        run: |
          gh issue list --label "$LABEL" --state open --json number --jq '.[].number' |
            while read -r number; do
              gh issue close "$number" --comment \
                "The pinned Hugo version now matches its newest release. Closed by \`Pin staleness\`."
            done
