name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # A workflow_dispatch from another branch must not reach Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the site
        uses: ./.github/actions/build-site

      - name: Check the CSP and accessibility in Chromium
        env:
          CSP_WORKERS: 8
        run: npm run check:csp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          # Without it the action drops dot-directories, and /.well-known/security.txt (#190) with them.
          include-hidden-files: true

      # The baseline pull requests compare their screenshots with. It never holds up the deploy.
      - name: Capture visual smoke screenshots
        continue-on-error: true
        env:
          TZ: Europe/Berlin
        run: npm run visual:capture -- --public --out artifacts/visual-smoke/main

      - name: Upload visual smoke screenshots
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-main
          path: artifacts/visual-smoke/main/
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/main'
    # Only the job that publishes gets the Pages and OIDC tokens; the build runs npm ci and Playwright.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
