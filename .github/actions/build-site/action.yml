name: Build and check the site
description: Installs the toolchain, builds the site into public/ and runs the checks CI and the deploy share.

# The caller checks the repository out first. The Hugo pin is .github/hugo.env, the one file
# scripts/check-hugo-pin.js and scripts/run-hugo.js read as well.
runs:
  using: composite
  steps:
    - name: Install Hugo CLI
      shell: bash
      run: |
        version=$(sed -n 's/^HUGO_VERSION=//p' .github/hugo.env)
        sha256=$(sed -n 's/^HUGO_SHA256=//p' .github/hugo.env)
        deb="${RUNNER_TEMP}/hugo.deb"
        wget -O "$deb" "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.deb"
        echo "${sha256}  ${deb}" | sha256sum -c -
        sudo dpkg -i "$deb"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install Node.js dependencies
      shell: bash
      run: npm ci

    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

    - name: Cache the Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # Playwright's apt run updates the package lists, so poppler (pdfinfo, for the CV checks) needs no second update.
    - name: Install Playwright browser and PDF tools
      shell: bash
      env:
        CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        if [[ "$CACHED" == "true" ]]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi
        sudo apt-get install -y --no-install-recommends poppler-utils

    - name: Build and check the site
      shell: bash
      env:
        HUGO_ENVIRONMENT: production
        TZ: Europe/Berlin
      run: npm run check:static
