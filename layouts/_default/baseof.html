<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ .Site.Language.Direction | default `ltr` }}" data-theme="dark">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }}{{ if .IsHome }} page-home{{ end }}{{ with .Type }} type-{{ . }}{{ end }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "site-header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "site-footer.html" . }}
    {{ $js := resources.Get "js/site.js" | minify | fingerprint }}
    <script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
    {{ if .Store.Get "hasMermaid" }}
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs';
      mermaid.initialize({
        startOnLoad: true,
        theme: 'base',
        themeVariables: {
          fontFamily: 'Outfit, system-ui, sans-serif',
          fontSize: '15px',
          background: 'transparent',
          primaryColor: '#2b3344',
          primaryTextColor: '#f2ece0',
          primaryBorderColor: '#0a0b10',
          secondaryColor: '#151923',
          tertiaryColor: '#151923',
          lineColor: '#ffb547',
          signalColor: '#ffb547',
          textColor: '#f2ece0',
          edgeLabelBackground: '#151923',
          clusterBkg: 'transparent',
          clusterBorder: '#2b3344',
        },
      });
    </script>
    {{ end }}
  </body>
</html>
