name: Build and check the site
description: Installs the toolchain, builds the site into public/ and runs the checks CI and the deploy share.

# The caller checks the repository out first, and sets HUGO_VERSION and HUGO_SHA256 in its job env:
# scripts/check-hugo-pin.js reads the pin out of .github/workflows.
runs:
  using: composite
  steps:
    - name: Install Hugo CLI
      shell: bash
      run: |
        deb="${RUNNER_TEMP}/hugo.deb"
        wget -O "$deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        echo "${HUGO_SHA256}  ${deb}" | sha256sum -c -
        sudo dpkg -i "$deb"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22
        cache: npm

    - name: Install Node.js dependencies
      shell: bash
      run: |
        if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
          npm ci
        fi

    - name: Install Playwright browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Install PDF tools
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y poppler-utils

    - name: Check blog assets
      shell: bash
      run: npm run check:blog-assets

    - name: Build the pixel building
      shell: bash
      run: npm run build:building

    - name: Build with Hugo
      shell: bash
      env:
        HUGO_ENVIRONMENT: production
        TZ: Europe/Berlin
      run: |
        hugo \
          --gc \
          --minify \
          --cleanDestinationDir

    - name: Check generated site metadata
      shell: bash
      run: npm run check:site-metadata

    - name: Check generated HTML
      shell: bash
      run: npm run check:generated-html

    - name: Generate CV PDF
      shell: bash
      run: npm run pdf

    - name: Check CV print length
      shell: bash
      run: npm run check:cv-print

    - name: Check internal links
      shell: bash
      run: npm run check:links
