version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only reaches .github/workflows, not the local composite action.
    directories:
      - "/"
      - "/.github/actions/build-site"
    schedule:
      interval: "weekly"
    # github-actions does not support the semver-*-days keys.
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
