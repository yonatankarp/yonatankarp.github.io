hero:
  eyebrow: "Staff Software Engineer · Kotlin, Spring Boot, Kafka · openapi-generator contributor"
  title: "I turn messy backend domains into systems teams can own."
  lede: "I work where product rules, vendor integrations, event flows, and operational risk meet. Recently that has meant compliance services, risk orchestration, API contracts, internal tools, and migrations that leave teams with clearer ownership."
  availability: "Open to Staff+ backend roles in Tel Aviv and central Israel, on-site or hybrid."
  primaryAction:
    label: "Discuss Staff+ backend work"
    url: "#floor-R"   # the roof: contact

about:
  kicker: "How I work"
  title: "I like the moment when a domain becomes specific enough to build."
  paragraphs:
    - "The hard part of backend engineering is often not choosing a framework. It is finding the real boundary: which team owns the rule, which event is authoritative, what happens when a vendor disagrees, and how the next engineer will debug the failure at 2 a.m."
    - "That is where I tend to be useful. I ask until the domain is crisp enough to model, then turn it into production code, API contracts, migration plans, dashboards, runbooks, or diagrams that survive the handoff."
    - "I care about strong implementation, but the higher leverage is making the system easier for the whole team to operate, extend, and argue about with evidence."
  facts:
    - label: "Works across"
      text: "Backend systems, Kotlin/JVM, service design, OpenAPI, Kafka, internal tools, docs, and OSS"
    - label: "Bias toward"
      text: "Shared understanding, small useful abstractions, boring reliability, and explanations that survive handoff"

education:
  title: "Courses, degrees, and topics that keep showing up in the work."

projects:
  kicker: "Selected work"
  title: "Public work that turns repeated problems into reusable material."

proof:
  items:
    - label: "Compliance platform"
      floor: "7"   # the building floor whose panel tells this story
      title: "Creating a new service boundary for compliance workflows."
      context: "Transaction monitoring, screening, and sanction checks crossed product rules, vendor behavior, alerts, and audit expectations."
      decision: "I authored the technical spec and interfaces, led the ComplyAdvantage integration, and covered Kafka DLT alerts, settlement reports, and compliance states in the service design."
      result: "Scattered operational knowledge became a service teams can reason about, monitor, and recover."
    - label: "Risk architecture"
      floor: "6"   # the building floor whose panel tells this story
      title: "Moving risk work toward explicit orchestration and contracts."
      context: "Risk decisions depended on multiple services, fraud providers, recurrent identification, tokenization, and direct debit behavior."
      decision: "I co-designed the Risk Orchestrator, led the Ravelin integration, and authored the Buyer Risk Assessment target architecture."
      result: "Risk changes gained a clearer coordination model across providers, payment behavior, and service boundaries."
    - label: "Engineering leverage"
      floor: "7"   # the building floor whose panel tells this story
      title: "Turning repeated operational friction into shared tooling."
      context: "Platform work gets expensive when incidents, cronjobs, migrations, and service setup depend on private memory."
      decision: "I build Backstage tools, templates, migration plans, and upstream fixes when the reusable path beats another one-off patch."
      result: "Engineers start from a known path and can challenge decisions through specs, dashboards, examples, and code."

outcomes:
  title: "What good teams get from working with me."
  items:
    - title: "Shared understanding"
      text: "People can talk about the system with the same words, fewer assumptions, and less folklore."
    - title: "Better decisions"
      text: "Tradeoffs are written down clearly enough that the team can challenge, revisit, and improve them."
    - title: "Reusable patterns"
      text: "Repeated problems become examples, libraries, templates, and habits instead of private knowledge."
    - title: "Stronger ownership"
      text: "The system is easier to change because more people understand how and why it works."

fit:
  title: "I am useful when the team needs clarity as much as code."
  items:
    - "Important work with fuzzy ownership."
    - "Backend systems carrying hidden context."
    - "Repeated problems that need reusable tooling."
    - "Teams that need a pathfinder and teacher."

