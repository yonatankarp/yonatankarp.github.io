{{ define "main" }}
{{ $t := hugo.Data.ui.search }}
<div class="px-sheet px-search">
  <header class="px-search__head">
    <p class="px-kicker">{{ $t.kicker }}</p>
    <h1>{{ .Title }}</h1>
    <p class="px-search__lede">{{ $t.lede }}</p>
  </header>
  <form class="px-search__form" role="search" action="{{ "search/" | relURL }}" method="get">
    <label class="px-search__label" for="site-search">{{ $t.label }}</label>
    <input id="site-search" name="q" class="search-input" type="search" placeholder="{{ .Params.placeholder | default $t.placeholder }}">
  </form>
  <noscript><p class="px-search__status">{{ $t.noscript | markdownify }}</p></noscript>
  <p id="search-status" class="px-search__status" role="status"></p>
  <div id="search-results" class="px-search__results">
    <article class="search-result search-result--empty">
      <span>{{ $t.try }}</span>
      <p>{{ $t.topics }}</p>
    </article>
  </div>
</div>
{{ end }}
