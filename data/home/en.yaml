hero:
  eyebrow: "Staff Software Engineer · Kotlin, Spring Boot, Kafka · openapi-generator contributor"
  title: "I turn messy backend domains into systems a team can run and change."
  lede: "I work where product rules, vendor integrations, event flows, and operational risk meet. Recently that has meant compliance services, risk orchestration, API contracts, internal tools, and migrations that leave each team clear on which part is theirs."
  availability: "Open to Staff+ backend roles in Israel, on-site or hybrid."
  primaryAction:
    label: "Discuss Staff+ backend work"
    url: "#floor-R"   # the roof: contact

about:
  kicker: "How I work"
  title: "I like the moment when a domain becomes specific enough to build."
  paragraphs:
    - "In backend work the hard part is usually finding the real boundary: whose rule it is, which event is authoritative, what happens when a vendor disagrees, and how the next engineer will debug the failure at 2 a.m."
    - "That is usually where I help. I keep asking until the domain is crisp enough to model, then turn it into production code, API contracts, migration plans, dashboards, runbooks, or diagrams that survive the handoff."
    - "Good code is part of it. Most of the payoff comes later, when the whole team can run the system, extend it, and argue about it with evidence."
  facts:
    - label: "Works across"
      text: "Backend systems, Kotlin/JVM, service design, OpenAPI, Kafka, internal tools, docs, and OSS"
    - label: "Bias toward"
      text: "A shared vocabulary, small useful abstractions, boring reliability, and written explanations"

education:
  title: "Courses, degrees, and topics that keep showing up in the work."

projects:
  kicker: "Selected work"
  title: "What I build on my own time."

proof:
  items:
    - label: "Compliance platform"
      floor: "7"   # the building floor whose panel tells this story
      title: "Creating a new service boundary for compliance workflows."
      context: "Transaction monitoring, screening, and sanction checks crossed product rules, vendor behavior, alerts, and audit expectations."
      decision: "I authored the technical spec and interfaces, led the transaction monitoring vendor integration, and covered Kafka DLT alerts, settlement reports, and compliance states in the service design."
      result: "Shadow mode found lost messages and transactions that could have cost about €55k. Operational knowledge that was scattered now sits in one service teams can monitor and recover."
    - label: "Risk architecture"
      floor: "6"   # the building floor whose panel tells this story
      title: "Moving risk work toward explicit orchestration and contracts."
      context: "Risk decisions depended on multiple services, fraud providers, recurrent identification, tokenization, and direct debit behavior."
      decision: "I co-designed the Risk Orchestrator, led the fraud vendor integration, and authored the Buyer Risk Assessment target architecture."
      result: "Risk decisions now run through one orchestrator, and the fraud integration cut fraud by 4-6%."
    - label: "Engineering leverage"
      floor: "7"   # the building floor whose panel tells this story
      title: "Turning repeated operational friction into shared tooling."
      context: "Platform work gets expensive when incidents, cronjobs, migrations, and service setup depend on private memory."
      decision: "I build Backstage tools, templates, migration plans, and upstream fixes when the reusable path beats another one-off patch."
      result: "The dead-letter and replay library runs in 3 services, and the triage tooling was used across about 80 production incidents."

outcomes:
  title: "What I try to leave behind on a team."
  text: "People use the same words for the system and rely less on folklore. Tradeoffs are written down where the team can find and challenge them later. A problem that keeps coming back becomes an example, a library or a template anyone can pick up, and the system gets easier to change because more people know why it works the way it does."

fit:
  title: "I am useful when the team needs clarity as much as code."
  items:
    - "Important work that no team has clearly claimed."
    - "Backend systems that run on context nobody wrote down."
    - "Repeated problems that deserve a tool."
    - "Teams that want someone to find the path and teach it."

testimonials:
  title: "What people notice after working with me."

contact:
  kicker: "What's next"
  title: "If your backend domain needs untangling, let's talk."
  text: "My strongest fit is Staff+ backend work where the domain has to become one system the whole team understands."
  priorities:
    - "Staff+ backend roles in Israel, on-site or hybrid."
    - "Payments, risk, compliance, or platform architecture."
    - "OSS, technical writing, and teaching."
  location: &location "Berlin, Germany"   # where Yonatan lives now: the roof, CV, footer, share alt and JSON-LD read it; hugo.toml's descriptions repeat it by hand
  facts:   # the roof's; `key` stays as it is: the Post Office's letter picks its fact by best_for
    - key: "location"
      label: "Based in"
      text: *location
    - key: "best_for"
      label: "Best for"
      text: "Teams turning scattered services and vendors into one platform"
  podcast:   # the city's Radio Mast; `text`, one optional sentence, goes before the link
    title: "The Reading Club"
    text: "An AI-generated podcast of concise summaries of software engineering books."
    platform: "Spotify"
    url: "https://open.spotify.com/show/4pZG0kazNvz9wHriBv6ni0"
  email:
    label: "Email"
    address: "me@yonatankarp.com"
  links:
    - label: "GitHub"
      text: "github.com/yonatankarp"
      url: "https://github.com/yonatankarp"
    - label: "LinkedIn"
      text: "linkedin.com/in/yonatankarp"
      url: "https://www.linkedin.com/in/yonatankarp/"
  social:   # the top bar's icon row; `icon` names its pixel drawing in layouts/partials/pixel-icon.html
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/yonatankarp/"
      icon: "linkedin"
    - label: "GitHub"
      url: "https://github.com/yonatankarp"
      icon: "github"
    - label: "X (Twitter)"
      url: "https://x.com/yonvata"
      icon: "x"
    - label: "The Reading Club, AI summaries of software engineering books, on Spotify"
      url: "https://open.spotify.com/show/4pZG0kazNvz9wHriBv6ni0"
      icon: "podcast"

