name: Site CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Validate Hugo build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # downloads the last deploy's screenshots to compare against
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the site
        uses: ./.github/actions/build-site

      - name: Check the CSP and accessibility in Chromium
        env:
          CSP_WORKERS: 8
        run: npm run check:csp

      - name: Capture visual smoke screenshots
        env:
          TZ: Europe/Berlin
        run: npm run visual:capture -- --public --out artifacts/visual-smoke/candidate

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-smoke-screenshots
          path: artifacts/visual-smoke/candidate/
          if-no-files-found: ignore
          retention-days: 14

      # Report only: the homepage animates, so its captures differ from run to run.
      - name: Compare the screenshots with the last deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]] || ! gh run download "$run" --name visual-smoke-main --dir artifacts/visual-smoke/main; then
            echo "No screenshots from a deploy of main to compare with yet." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run --silent visual:compare -- \
            --baseline artifacts/visual-smoke/main \
            --candidate artifacts/visual-smoke/candidate | tee -a "$GITHUB_STEP_SUMMARY"

  lint_test_art:
    name: Lint, test and rebuild the art
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Test the scripts
        run: npm test

      - name: Lint (ESLint and Ruff)
        run: npm run lint

      # The pixel art is built from the committed picks (web3d/pixel/paintings/picks/) and committed as built. Rebuilt here, it
      # must match pixel for pixel (a lossless WebP's bytes can differ between runs), and the data the pipeline writes
      # (exterior.json, city.json, workshop.json, the depth maps and the animations' -fx.json, data/floor_accents.yaml, the check of data/phases.json) must come out unchanged.
      - name: Rebuild the art and compare it
        run: |
          out="${RUNNER_TEMP}/art"
          mkdir -p "$out"
          uv run web3d/pixel/gen_floors.py "$out"
          uv run web3d/pixel/gen_exterior.py build "$out"
          for time in $(node -p 'Object.keys(require("./data/phases.json")).filter((t) => t !== "dusk").join(" ")'); do
            uv run web3d/pixel/gen_exterior.py build "$out" --time "$time"
          done
          uv run web3d/pixel/gen_city.py build "$out"
          uv run web3d/pixel/gen_library.py build "$out"
          uv run web3d/pixel/gen_workshop.py build "$out"
          uv run web3d/pixel/compare_art.py "$out"
          if ! git diff --exit-code -- data; then
            echo "::error::The art pipeline rewrote committed files (diff above): rerun it locally and commit the result."
            exit 1
          fi

  dependabot_auto_merge:
    needs: [build, lint_test_art]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    # The reusable workflow declares contents: read and cannot exceed this, so omitting it here would fail the run.
    permissions:
      contents: read
      pull-requests: write
    uses: yonatankarp/github-actions/.github/workflows/dependabot-auto-merge.yml@297410f4ae5973221b8ac10fff5e370d9c1212af # v2
    secrets:
      GITHUB_PAT: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
